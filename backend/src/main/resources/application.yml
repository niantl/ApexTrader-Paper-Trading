spring:
  application:
    name: apextrader-backend
    
  # Unit 4: Configuration & Application Properties
  datasource:
    # Using H2 embedded database for development and testing
    url: jdbc:h2:mem:apextraderdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
    
  jpa:
    # Hibernate Auto DDL setup
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Custom Application Properties
apextrader:
  trading:
    default-virtual-balance: 100000.00
